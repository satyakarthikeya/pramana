# configs/verification.yaml
# Owner: P.P. Satya Karthikeya — the ONE place gateway thresholds live (AGENTS.md §3.3).
# Nothing in src/pramana/verification/ may hardcode any of these values.
#
# The loader (src/pramana/verification/config.py) has no defaults: a missing or
# misspelled key here fails at load time rather than quietly reverting a threshold.

statistics:
  alpha: 0.05                # BH-FDR level, applied across the whole run
  n_permutations: 10000      # p-value floor is 1/(B+1) = 9.999e-05, well under alpha
  n_bootstrap: 5000
  seed: 20260817             # configurable AND logged, for reproducibility (AGENTS.md §3.4)
  # PROVISIONAL: structural placeholder, not calibrated against demo data --
  # see SCOPE.md 7 (open items) and docs/OPEN_ISSUES.md 11.
  min_observations: 20       # fewer usable rows than this: conclude nothing, fail closed
  # Largest BH family a run may test (PLAN 5, T7). The loader refuses a config whose
  # n_permutations could not resolve a p-value small enough to pass BH at this size:
  # n_permutations >= m_max / alpha - 1.
  m_max: 40
  interval_resamples: 1000   # S5: resamples per interval (each recomputes the effect: about 3 s a claim)
  interval_confidence: 0.95  # S5: level of the interval beside an effect; descriptive only
  power_target: 0.8          # S1: detection probability for the "could have found" note; descriptive only

dependence:
  # PLAN D5 / D6 / D6b (P1). Signed off by the verification owner on 2026-10-24:
  # lag-1 screen on differences, structural columns readable, 50/50 split.
  confirmation_fraction: 0.5     # share of rows only the gate sees; the rest is exploration
  block_length: auto             # auto = ceil(steps ** (1/3)) of the series being tested
  max_diff_autocorrelation: 0.5  # differences still this autocorrelated: NOT_TESTABLE
  min_series_length:             # periods needed in the CONFIRMATION rows, per claim type
    trend: 20
    correlation: 20
  min_clusters: 6                # entities needed to move a label between whole entities
  min_split_entities: 8          # a panel splits by entity only with this many; else by time
  # A split by time may hold back more than confirmation_fraction so the confirmation rows
  # reach min_series_length, but only while this many periods stay for exploration (F2).
  min_exploration_periods: 8
  # S7: earlier runs on the same held-back rows after which a proof says they were reused.
  # Disclosure only; a time-ordered split cannot be redrawn, so nothing is blocked.
  max_prior_looks: 3

attacks:
  # PLAN §7.2, P5. PROVISIONAL: tuned on the planted cases in
  # tests/unit/verification/test_attacks.py (each attack catches its case; the whole
  # set kills a true moderate finding <= 15% of the time). Not yet calibrated on S1.
  trim_fraction: 0.10          # A1: most rows it may drop, as a share of the rows
  outlier_z: 3.5               # A1: robust z (median / 1.4826 MAD) beyond which a row is extreme
  shrink_fraction: 0.5         # an effect below this share of the original has collapsed
  min_subgroup_n: 30           # rows a half or a subgroup needs before it is judged
  min_half_periods: 8          # periods each half of an ordered series needs (A2)
  subgroup_weight_floor: 0.2   # A4: only a level holding this share of rows can break it
  max_subgroup_columns: 3      # A4: grouping columns examined, in table order
  max_subgroup_levels: 10      # A4: a grouping column with more levels is skipped
  min_confound_score: 0.1      # A3: |assoc(x,z)| * |assoc(y,z)| below this: no control
  max_control_proxy: 0.9       # A3: a column this rank-correlated with x or y is a copy of it, not a control
  refuter_enabled: false       # S8: a model may SUGGEST extra controls / subgroup columns; it can only add checks
  refuter_max_controls: 2      # S8: suggested extra controls kept
  refuter_max_groups: 2        # S8: suggested extra subgroup columns kept
  identity_tolerance: 1.0e-6   # A7: max deviation, as a share of sd(y), for "exactly"
  # Report-card finding (docs/evidence/GATE_CALIBRATION_2026-10-25.md): with `point`, A2 breaks a
  # true rho 0.2-0.3 effect in 6-24% of cases at n 60-120 on clean shapes (0-14% at n 300), because
  # it compares a noisy half estimate with the full one. `interval` breaks only on evidence of
  # collapse (0-7% on the same cells) but also catches far less of a planted late-only effect
  # (n 60/120/300: 8/19/51% against 62/88/96% for `point`) and removes 4-11 times fewer luck-passes.
  # Neither rule has low false kill AND high detection at these sample sizes, so `point` stays the
  # default; flipping it is the verification owner's decision (AGENTS.md 8.10). Where no interval
  # exists (a block-differenced series) `interval` uses the point rule and records `details.fallback`.
  break_rule: point            # A2: point | interval
  # Interval rule only: the nominal one-sided level of each half's bound, NOT the false-kill rate you
  # get. Measured A2 false kill was 0.1% at 0.10 and 0.8% at 0.40; late-only detection (A2 breaks) was
  # 24% at 0.10 and 49% at 0.40. 0.10 is left so nothing changes unless the owner picks a value.
  false_kill_budget: 0.10
  damage_resamples: 1000       # interval rule: bootstrap resamples per half
  min_capacity: 2              # fewer checks than this survived-or-broken: shown as "little checked"

evidence:
  # Gating bands per effect metric. `min` is the floor below which a result is
  # NEGLIGIBLE no matter how small its q-value is (AGENTS.md §3.5); `strong` is where
  # the effect leg of the evidence score saturates and is used for RANKING only.
  # The metrics are not on a common scale, so a single global cutoff would change how
  # hard it is to pass depending on which test ran.
  #
  # CALIBRATION STATUS (2026-10-14; table and reasoning in docs/CALIBRATION_BANDS.md,
  # reproducible with scripts/calibration/measure_effects.py):
  #  * spearman_rho: MEASURED against data/demo/nhanes_demo.csv (NHANES 2017-18, 1,500
  #    adults). The planted true pairs sit at |rho| 0.483 (age~systolic BP) and 0.328
  #    (BMI~HDL); the 0.10 floor clears the weaker by 0.23 (~8 SE at n=1500). The floor
  #    does NOT separate truth from chance nulls (decoy 0.298, chance pair 0.278 are close
  #    to 0.328): q < alpha does that. The floor only stops large-n trivial effects.
  #  * kendall_tau_b, cliffs_delta, epsilon_squared: NO planted anchor in this frame (no
  #    trend candidate, no planted group difference), so these remain CONVENTION-based
  #    (Cohen / Romano "small" edge) and PROVISIONAL, not calibrated.
  #  * cramers_v: unreachable (OPEN_ISSUES 10) and still uncalibrated.
  # Floors may not be raised casually: test_evidence pins epsilon_squared min <= 0.141
  # (sqrt(0.02) must PASS) and cramers_v min to (0.09, 0.18]. A stricter tier
  # (rho/delta 0.20) is a policy decision recorded in docs/CALIBRATION_BANDS.md.
  effect_thresholds:
    spearman_rho:            # rank correlation, signed
      min: 0.10
      strong: 0.50
    kendall_tau_b:           # runs smaller than rho for the same relationship
      min: 0.07
      strong: 0.35
    cliffs_delta:            # two-group dominance, signed; 0.15 ≈ Romano's "negligible" edge
      min: 0.15
      strong: 0.47
    epsilon_squared:         # k-group variance ratio, unsigned; gated on its square root
      min: 0.10
      strong: 0.50
    cramers_v:               # contingency association; threshold scales down with table size
      min: 0.10
      strong: 0.50
    relative_change:         # T4 period change, (cur - prev) / |prev|; CONVENTION, PROVISIONAL
      min: 0.05
      strong: 0.25
    mase_reduction:          # forecast claims: share of the baseline's scaled error removed (1 - MASE ratio)
      min: 0.10              # MEASURED, PROVISIONAL: docs/evidence/FORECAST_CLAIM_2026-10-25.md section 4
      strong: 0.40

executor:
  timeout_seconds: 300       # one execution; 60 s was too short for tables of ~27,000 held-out rows (diamonds)
  max_memory_mb: 1024
  max_retries: 1             # after retries are exhausted: fail-closed, never PASS
  allowed_imports:           # AGENTS.md §4 — untrusted LLM-generated code
    # No statistics library appears here by design: generated code that can compute
    # its own p-value makes the gate read a number nobody audited (PROJECT.md §3).
    # Our vetted module is on the list instead — it uses scipy internally, but it is
    # audited code with known-answer tests behind it.
    - numpy
    - pandas
    - pramana.verification.stats

llm:
  generator: template        # vetted test per claim type and scheme (design v3, decision 1). `llm` makes DeepSeek write each test (opt-in); select it here or with PRAMANA_VERIFICATION_GENERATOR=llm
  provider: deepseek         # same provider as analysis; different role and prompt
  model: deepseek-flash
  temperature: 0.0           # falsification code generation should be near-deterministic
  # API key comes from the DEEPSEEK_API_KEY env var. Never put it in this file.

claims:
  # Claim types that are built and measured but not yet switched on. A flag here changes what the
  # planner may ask for and what the gateway will test; with it false every run is exactly what it
  # was before the type existed. The default is the verification owner's decision (AGENTS.md 8.10)
  # after reading docs/evidence/FORECAST_CLAIM_2026-10-25.md.
  forecast_enabled: false

forecast:
  # A forecast claim is about PAST OUT-OF-SAMPLE ACCURACY on the held-back periods; see
  # src/pramana/verification/stats/forecast.py. MEASURED values are in the evidence note.
  max_horizon: 6               # periods ahead a claim may name
  min_origins: 12              # backtest origins needed in the held-back periods: fewer is NOT_TESTABLE
  min_blocks: 11               # blocks of origins (origins / horizon); the loader needs 2**blocks to resolve alpha / m_max
  min_cycles: 2                # full seasonal cycles of history before the first origin
  min_train_floor: 8           # periods of history before the first origin even without a cycle
  max_gap_fraction: 0.1        # missing periods in the history tolerated (carried forward from the past)
  seasonal_length:             # periods per cycle; a period type not listed here has no forecast claim
    month: 12
    quarter: 4
  interval_level: 0.95         # nominal level of the stated prediction interval (checked by F4)
  selection_origins: 6         # exploration origins used to pick the method and the baseline
  baseline: auto               # auto: seasonal-naive or last-value, whichever was closer on exploration rows; seasonal_naive: always seasonal-naive
  attacks:
    min_origins_per_part: 4    # origins a part (recent third, either side of a break) needs before it is judged
    recent_fraction: 0.3333    # F2: the most recent share of the origins
    horizon_margin: 0.0        # F3: a horizon is broken when its reduction is below minus this
    interval_tolerance: 0.10   # F4: stated interval's coverage may differ from nominal by this much
    calibration_changes_verdict: false   # F4: false = wording only (accuracy held up, range not calibrated)
    cusum_critical: 1.358      # F5: Kolmogorov 5% point for the normalised CUSUM of one-step errors
