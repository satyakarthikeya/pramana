# configs/verification.yaml
# Owner: P.P. Satya Karthikeya — the ONE place gateway thresholds live (AGENTS.md §3.3).
# Nothing in src/pramana/verification/ may hardcode any of these values.
#
# The loader (src/pramana/verification/config.py) has no defaults: a missing or
# misspelled key here fails at load time rather than quietly reverting a threshold.

statistics:
  alpha: 0.05                # BH-FDR level, applied across the whole run
  n_permutations: 10000      # p-value floor is 1/(B+1) = 9.999e-05, well under alpha
  n_bootstrap: 5000
  seed: 20260817             # configurable AND logged, for reproducibility (AGENTS.md §3.4)
  # PROVISIONAL: structural placeholder, not calibrated against demo data --
  # see SCOPE.md 7 (open items) and docs/OPEN_ISSUES.md 11.
  min_observations: 20       # fewer usable rows than this: conclude nothing, fail closed
  # Largest BH family a run may test (PLAN 5, T7). The loader refuses a config whose
  # n_permutations could not resolve a p-value small enough to pass BH at this size:
  # n_permutations >= m_max / alpha - 1.
  m_max: 40

dependence:
  # PLAN D5 / D6 / D6b (P1). Signed off by the verification owner on 2026-10-24:
  # lag-1 screen on differences, structural columns readable, 50/50 split.
  confirmation_fraction: 0.5     # share of rows only the gate sees; the rest is exploration
  block_length: auto             # auto = ceil(steps ** (1/3)) of the series being tested
  max_diff_autocorrelation: 0.5  # differences still this autocorrelated: NOT_TESTABLE
  min_series_length:             # periods needed in the CONFIRMATION rows, per claim type
    trend: 20
    correlation: 20
  min_clusters: 6                # entities needed to move a label between whole entities
  min_split_entities: 8          # a panel splits by entity only with this many; else by time

attacks:
  # PLAN §7.2, P5. PROVISIONAL: tuned on the planted cases in
  # tests/unit/verification/test_attacks.py (each attack catches its case; the whole
  # set kills a true moderate finding <= 15% of the time). Not yet calibrated on S1.
  trim_fraction: 0.10          # A1: most rows it may drop, as a share of the rows
  outlier_z: 3.5               # A1: robust z (median / 1.4826 MAD) beyond which a row is extreme
  shrink_fraction: 0.5         # an effect below this share of the original has collapsed
  min_subgroup_n: 30           # rows a half or a subgroup needs before it is judged
  min_half_periods: 8          # periods each half of an ordered series needs (A2)
  subgroup_weight_floor: 0.2   # A4: only a level holding this share of rows can break it
  max_subgroup_columns: 3      # A4: grouping columns examined, in table order
  max_subgroup_levels: 10      # A4: a grouping column with more levels is skipped
  min_confound_score: 0.1      # A3: |assoc(x,z)| * |assoc(y,z)| below this: no control
  identity_tolerance: 1.0e-6   # A7: max deviation, as a share of sd(y), for "exactly"

evidence:
  # Gating bands per effect metric. `min` is the floor below which a result is
  # NEGLIGIBLE no matter how small its q-value is (AGENTS.md §3.5); `strong` is where
  # the effect leg of the evidence score saturates and is used for RANKING only.
  # The metrics are not on a common scale, so a single global cutoff would change how
  # hard it is to pass depending on which test ran.
  #
  # CALIBRATION STATUS (2026-10-14; table and reasoning in docs/CALIBRATION_BANDS.md,
  # reproducible with scripts/calibration/measure_effects.py):
  #  * spearman_rho: MEASURED against data/demo/nhanes_demo.csv (NHANES 2017-18, 1,500
  #    adults). The planted true pairs sit at |rho| 0.483 (age~systolic BP) and 0.328
  #    (BMI~HDL); the 0.10 floor clears the weaker by 0.23 (~8 SE at n=1500). The floor
  #    does NOT separate truth from chance nulls (decoy 0.298, chance pair 0.278 are close
  #    to 0.328): q < alpha does that. The floor only stops large-n trivial effects.
  #  * kendall_tau_b, cliffs_delta, epsilon_squared: NO planted anchor in this frame (no
  #    trend candidate, no planted group difference), so these remain CONVENTION-based
  #    (Cohen / Romano "small" edge) and PROVISIONAL, not calibrated.
  #  * cramers_v: unreachable (OPEN_ISSUES 10) and still uncalibrated.
  # Floors may not be raised casually: test_evidence pins epsilon_squared min <= 0.141
  # (sqrt(0.02) must PASS) and cramers_v min to (0.09, 0.18]. A stricter tier
  # (rho/delta 0.20) is a policy decision recorded in docs/CALIBRATION_BANDS.md.
  effect_thresholds:
    spearman_rho:            # rank correlation, signed
      min: 0.10
      strong: 0.50
    kendall_tau_b:           # runs smaller than rho for the same relationship
      min: 0.07
      strong: 0.35
    cliffs_delta:            # two-group dominance, signed; 0.15 ≈ Romano's "negligible" edge
      min: 0.15
      strong: 0.47
    epsilon_squared:         # k-group variance ratio, unsigned; gated on its square root
      min: 0.10
      strong: 0.50
    cramers_v:               # contingency association; threshold scales down with table size
      min: 0.10
      strong: 0.50

executor:
  timeout_seconds: 60
  max_memory_mb: 1024
  max_retries: 1             # after retries are exhausted: fail-closed, never PASS
  allowed_imports:           # AGENTS.md §4 — untrusted LLM-generated code
    # No statistics library appears here by design: generated code that can compute
    # its own p-value makes the gate read a number nobody audited (PROJECT.md §3).
    # Our vetted module is on the list instead — it uses scipy internally, but it is
    # audited code with known-answer tests behind it.
    - numpy
    - pandas
    - pramana.verification.stats

llm:
  generator: llm             # D1: DeepSeek writes each test. `template` stays as the reference and the offline mode; select it here or with PRAMANA_VERIFICATION_GENERATOR=template
  provider: deepseek         # same provider as analysis; different role and prompt
  model: deepseek-flash
  temperature: 0.0           # falsification code generation should be near-deterministic
  # API key comes from the DEEPSEEK_API_KEY env var. Never put it in this file.
