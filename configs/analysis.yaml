# configs/analysis.yaml
# Owner: P. Rohith — ingestion, cleaning, and hypothesis generation settings.

ingestion:
  max_rows: 200000
  max_file_mb: 100
  allowed_formats: [csv, xlsx]

cleaning:
  seed: 20260817             # cleaning must be reproducible
  missing_strategy: flag     # flag | drop | impute — decide per column profile
  outlier_method: iqr

schema_inference:
  use_llm_for_ambiguous_only: true   # heuristics first; Gemma only when unclear
  model: gemma                        # local, cheap tasks only (AGENTS.md §2)
  # Fail-closed cutoffs. A column the heuristics cannot place above min_confidence
  # becomes UNKNOWN and is excluded from hypothesis generation — a guessed role is
  # how a bad CandidateInsight reaches the gateway.
  min_confidence: 0.70
  min_non_null: 20             # fewer usable rows than this and the column is UNKNOWN
  id_unique_ratio: 0.95        # distinct-value share at which a column is identifier-like
  categorical_max_levels: 20   # more levels than this and labels are not a grouping
  ordinal_max_levels: 12       # integer columns at or under this many levels read ordinal
  datetime_parse_min_ratio: 0.90  # share of non-nulls that must parse as timestamps

hypotheses:
  proposer:
    engine: deterministic       # explicit offline baseline; env PRAMANA_ANALYSIS_ENGINE=ollama
    model: gemma2:2b             # installed Q4_0; i5-11300H / 16GB RAM CPU profile
    base_url: http://localhost:11434
    timeout_seconds: 240
    seed: 20260817
    temperature: 0.0
    max_claims: 6
    max_columns: 16
    max_levels: 10
    max_prompt_chars: 12000
    max_question_chars: 1000
    max_hint_chars: 2000
    max_output_tokens: 1024
    context_tokens: 4096
    num_threads: 4
  max_candidates_per_run: 50   # keeps BH-FDR sane; gateway shouldn't be flooded
  # Reserve strongest candidates from each strategy before filling by magnitude.
  # These are minimum allocations, not separate batches or verification verdicts.
  strategy_min_candidates:
    correlation: 1
    group_difference: 1
    trend: 1
  strategies:
    correlation: true
    group_difference: true
    trend: true
  min_abs_correlation: 0.15    # exploratory pre-filter ONLY — never a verdict
  # Fail-closed floors. Below any of these no candidate is emitted at all, rather
  # than one the gateway could only ever return INCONCLUSIVE for while still
  # consuming a slot in the BH family.
  min_observations: 30         # pairwise-complete rows required to propose anything
  min_group_size: 10           # rows a level needs to count as a comparable group
  min_group_levels: 2
  max_group_levels: 10
  min_group_effect: 0.01       # exploratory eta² floor — pre-filter, never a verdict
  min_abs_trend_tau: 0.10      # exploratory |tau-b| floor — pre-filter, never a verdict

benchmark:
  n_datasets: 40
  excluded_famous: [iris, titanic, mtcars, boston, wine, diabetes]
  forbidden_sources: [mimic-iv, physionet]   # license conflict (AGENTS.md §6)
  # The live demo subset (PROJECT.md §7). Read by analysis/benchmark/demo_dataset.py.
  demo:
    seed: 20260817              # row sample, pilot sample and decoy values all derive from it
    n_rows: 1500                # PROJECT.md §7: ~500-2,000 rows
    min_age_years: 20           # adults only; the published relationships are adult findings
    # The injected false correlation: a nonsense column recorded on a tiny pilot
    # subsample, coupled to one real column so the exploratory scan sees a genuine
    # in-sample |rho| well above hypotheses.min_abs_correlation. At n = pilot_rows that
    # rho is indistinguishable from chance, which is what the gateway must conclude.
    decoy_column: birth_moon_phase_pct
    decoy_target: hba1c_pct
    decoy_pilot_rows: 40
    decoy_target_rho: 0.30
