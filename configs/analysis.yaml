# configs/analysis.yaml
# Owner: P. Rohith — ingestion, cleaning, and hypothesis generation settings.

ingestion:
  max_rows: 200000
  max_file_mb: 100
  allowed_formats: [csv, xlsx]

cleaning:
  seed: 20260817             # cleaning must be reproducible
  missing_strategy: flag     # flag | drop | impute — decide per column profile
  outlier_method: iqr

schema_inference:
  use_llm_for_ambiguous_only: true   # heuristics first; no model refiner wired today
  model: deepseek-flash             # reserved for an explicitly wired semantic refiner
  # Fail-closed cutoffs. A column the heuristics cannot place above min_confidence
  # becomes UNKNOWN and is excluded from hypothesis generation — a guessed role is
  # how a bad CandidateInsight reaches the gateway.
  min_confidence: 0.70
  min_non_null: 20             # fewer usable rows than this and the column is UNKNOWN
  id_unique_ratio: 0.95        # distinct-value share at which a column is identifier-like
  categorical_max_levels: 20   # more levels than this and labels are not a grouping
  ordinal_max_levels: 12       # integer columns at or under this many levels read ordinal
  datetime_parse_min_ratio: 0.90  # share of non-nulls that must parse as timestamps

hypotheses:
  proposer:
    engine: api                 # api (DeepSeek) | deterministic (explicit offline baseline)
    api_base_url: https://api.deepseek.com
    api_model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    trace_backend: langfuse      # remote inference requires run-linked tracing
    model: deepseek-flash        # retained config alias; no local model runtime
    base_url: https://api.deepseek.com
    timeout_seconds: 240
    seed: 20260817
    temperature: 0.0
    max_claims: 6
    max_columns: 16
    max_levels: 10
    max_prompt_chars: 12000
    max_question_chars: 1000
    max_hint_chars: 2000
    max_output_tokens: 1024
    context_tokens: 4096
    num_threads: 4
  max_candidates_per_run: 50   # keeps BH-FDR sane; gateway shouldn't be flooded
  # Reserve strongest candidates from each strategy before filling by magnitude.
  # These are minimum allocations, not separate batches or verification verdicts.
  strategy_min_candidates:
    correlation: 1
    group_difference: 1
    trend: 1
  strategies:
    correlation: true
    group_difference: true
    trend: true
  min_abs_correlation: 0.15    # exploratory pre-filter ONLY — never a verdict
  # Fail-closed floors. Below any of these no candidate is emitted at all, rather
  # than one the gateway could only ever return INCONCLUSIVE for while still
  # consuming a slot in the BH family.
  min_observations: 30         # pairwise-complete rows required to propose anything
  min_group_size: 10           # rows a level needs to count as a comparable group
  min_group_levels: 2
  max_group_levels: 10
  min_group_effect: 0.01       # exploratory eta² floor — pre-filter, never a verdict
  min_abs_trend_tau: 0.10      # exploratory |tau-b| floor — pre-filter, never a verdict

benchmark:
  n_datasets: 40
  excluded_famous: [iris, titanic, mtcars, boston, wine, diabetes]
  forbidden_sources: [mimic-iv, physionet]   # license conflict (AGENTS.md §6)
  # The live demo subset (PROJECT.md §7). Read by analysis/benchmark/demo_dataset.py.
  demo:
    seed: 20260817              # row sample, pilot sample and decoy values all derive from it
    n_rows: 1500                # PROJECT.md §7: ~500-2,000 rows
    min_age_years: 20           # adults only; the published relationships are adult findings
    # The injected false correlation: a nonsense column recorded on a tiny pilot
    # subsample, coupled to one real column so the exploratory scan sees a genuine
    # in-sample |rho| well above hypotheses.min_abs_correlation. At n = pilot_rows that
    # rho is indistinguishable from chance, which is what the gateway must conclude.
    decoy_column: birth_moon_phase_pct
    decoy_target: hba1c_pct
    decoy_pilot_rows: 40
    decoy_target_rho: 0.30

# The analyst's workspace and its hard budgets. Nothing here is a statistical threshold:
# the gate lives in configs/verification.yaml. These only bound how much the analyst may
# explore and spend before it must stop and hand claims to the gateway.
workspace:
  sandbox:
    # Free-form Python for the analyst. OFF by default: it has static checks and a runtime
    # audit hook, but in the in-process API container it shares a filesystem with every
    # user's data. Turn on only for a single-user install. The fixed tools need no Python.
    enabled: false
    timeout_seconds: 20
    max_memory_mb: 1024
    max_output_chars: 4000
    allowed_imports: [numpy, pandas, math, statistics]
  agent:
    max_turns: 6                  # model calls per run
    max_tool_calls: 12            # tool and Python steps per run
    max_python_runs: 4            # free-form steps among them
    max_output_tokens: 800        # per model reply
    max_total_tokens: 24000       # input plus output across the whole run, hard stop
    max_result_chars: 3000        # a tool result is cut to this before the model reads it
    max_claims: 8                 # claims the analyst may hand to the gateway
    max_hypotheses_examined: 300  # pairs the analyst's tools may look at in one run
    temperature: 0.0
  chat:
    # "Talk to your data": limits for one question. Nothing here changes a verdict.
    max_turns: 5                  # model calls per question
    max_tool_calls: 8             # tool steps per question
    max_output_tokens: 700        # per model reply
    max_total_tokens: 20000       # input plus output for one question, hard stop
    max_result_chars: 3000        # a tool result is cut to this before the model reads it
    max_question_chars: 1000
    max_answer_chars: 1500        # longer model wording is withheld, not trimmed
    history_questions: 4          # earlier questions (never earlier answers) sent as context
    max_hypotheses_examined: 40   # column pairs the chat tools may look at per question
    max_tests_per_dataset: 50     # claims chat may send to the gateway on one dataset, ever
    max_messages_per_hour: 60     # per account
    temperature: 0.0

computed:
  # The Exact tier (PLAN §5.1): arithmetic on the uploaded table, shown with its formula.
  # Nothing here is a statistical threshold and nothing here reaches the gateway or memory.
  sector_engine: api            # api (DeepSeek reads column names, traced) | rules (offline)
  summary_engine: api           # api (DeepSeek rewords the top figures, number-checked) | template
  max_chart_points: 120         # periods drawn per line chart (most recent); keeps stored views small
  max_measures: 6               # numeric columns analysed per table
  max_segments: 12              # rows shown per segment table; the rest are grouped as "other"
  max_outliers_listed: 5
  max_margin_columns: 3     # grouping columns whose margin is compared (besides the entity column)
  max_margin_levels: 12     # a grouping column with more levels is skipped
  outlier_robust_z: 3.5         # |x - median| / (1.4826 * MAD) at or above this is listed
  seasonality_min_cycles: 2     # complete years of monthly/quarterly data before a seasonal profile
  min_prevalence_rows: 30       # rows with a value (and a weight) before a share is shown
  min_group_rows: 10            # rows a breakdown group needs before its share is shown
  identity_min_rows: 10         # complete rows before an identity can be reported
  identity_rel_tolerance: 0.001 # relative difference counted as "equal"
  identity_min_match: 0.99      # share of rows that must match
  # The analyst layer (docs/PLAN_data_analyst.md): ranking, the story and the new figures.
  # PROVISIONAL weights: they order figures for reading and never decide whether one is true.
  lead_items: 8                 # figures in the report's lead
  max_questions: 5              # "what to watch" questions (code templates, never advice)
  segment_growth_min_share: 0.02  # a segment under this share of the earlier total is not ranked by growth
  customer_min_customers: 10    # distinct customer ids before a customer view is shown
  customer_top_n: 10            # "the top N customers account for ..."
  story_weights:
    period_change: 90
    margins: 85
    price_volume_mix: 82
    variance_decomposition: 80
    segment_growth: 72
    customer_view: 70
    outliers: 66
    seasonality: 60
    concentration: 55
    segment_ranking: 40
    prevalence: 75
    weighted_means: 60
    rates: 58
    identity: 20
    data_quality: 15

measured:
  # The Measured tier (PLAN §5.2): closed-menu models scored on data they did not see, always
  # against a baseline. Every cutoff below is PROVISIONAL until the verification owner reviews
  # it against the planted suites (PLAN §8). Nothing here is a statistical test, a verdict or a
  # gateway threshold, and nothing here reaches the gateway, a model or memory.
  enabled: true                 # false skips the tier entirely (tests pin it off; PRAMANA_MEASURED_ENABLED overrides)
  seed: 20260817                # every split, shuffle, bootstrap and forest; logged on the result
  max_rows: 2000                # rows used by the models (a seeded sample above this; forecasts use every row)
  max_features: 12              # columns offered to a model, chosen by completeness and column order, never by the target
  max_missing_fraction: 0.5     # a column missing more than this is not offered to a model
  max_categorical_levels: 12    # a text column with more levels than this is not offered as a feature
  time_budget_seconds: 180      # tasks not started before this are shown as "not run"
  min_rows: 60                  # fewer usable rows than this and no model is fitted
  outer_folds: 5                # held-out folds that produce the reported score
  inner_folds: 3                # folds used inside each training part to pick between grid settings
  min_class_rows: 20            # rows the smallest class needs before a class target is modelled
  max_class_levels: 6
  lift_floor: 0.02              # held-out lift (R-squared or balanced accuracy) at or below this is "no model beat the baseline"
  too_good_cutoff: 0.995        # a held-out score at or above this is withheld ("too good to be true")
  leakage:
    id_unique_ratio: 0.98       # integer or text column with this share of distinct values is an identifier
    proxy_cutoff: 0.95          # a single feature scoring this alone on held-out rows is excluded as a proxy
    proxy_folds: 3
    identity_rel_tolerance: 0.001     # relative difference counted as an exact identity
    identity_min_match: 0.99    # share of complete rows that must match
    identity_min_rows: 20
    max_identity_columns: 30    # numeric columns searched for sums and differences of the target
  importance:
    correlated_rho: 0.8         # features with |spearman| above this are shuffled together as one group
    repeats: 3                  # shuffles per feature group per held-out fold
  grids:                        # fixed small grids; their full size is reported as "models tried"
    ridge_alpha: [0.1, 1.0, 10.0, 100.0]
    forest_trees: 40
    forest_depth: [4, 8]
    boosting_trees: 40
    boosting_depth: [2, 3]
    boosting_rate: [0.1]
    svm_c: [0.5, 5.0]
    svm_max_rows: 1500          # support vector machines are left out above this many rows (they scale badly)
    logistic_c: [0.1, 1.0, 10.0]
  segments:
    k_min: 2
    k_max: 6
    train_fraction: 0.7
    null_repeats: 5             # column-shuffled copies of the table clustered the same way
    silhouette_margin: 0.05     # held-out silhouette must beat the best shuffled one by this much
    bootstrap_repeats: 20
    ari_cutoff: 0.6             # adjusted Rand index between bootstrap and full-data groupings
    min_segment_share: 0.03
    max_profile_columns: 6
  anomalies:
    flag_fraction: 0.02         # share of rows flagged as unusual in combination
    seeds: 5
    robust_z: 3.5               # single-column rule, same cutoff as the Exact tier
    rank_stability_cutoff: 0.8  # mean rank correlation between seeds before the flags are shown
    max_listed: 10
    max_shared_columns: 4
    shared_min_shift: 1.5       # a column is named as shared when the flagged rows' median sits this many robust sd from the rest
  forecast:
    min_periods: 12             # fewer periods than this and nothing is forecast
    min_cycles: 2               # full seasonal cycles needed to model seasonality
    origins: 6                  # rolling-origin backtest origins (fewer if the series is short)
    min_origins: 3
    horizon:                    # periods ahead, per period type
      month: 6
      quarter: 2
      week: 8
      day: 7
      year: 1
      index: 1
    seasonal_length:            # periods per cycle (1 = no seasonality modelled)
      month: 12
      quarter: 4
      week: 52
      day: 7
      year: 1
      index: 1
    interval_level: 0.8         # nominal coverage of the prediction interval
    lift_floor_relative: 0.05   # error must be this fraction lower than the baseline's to count
    max_gap_fraction: 0.1       # missing periods tolerated (filled by interpolation)
    max_chart_points: 120
  threshold:
    grid_points: 15
    edge_fraction: 0.15         # a breakpoint must leave this share of rows on each side
    bootstrap_repeats: 30
    max_chart_points: 25

advisory:
  # After the gate: caveats and plain-language summaries for PASS findings. Nothing here can
  # change a verdict, add a claim to the run, or write to memory.
  skeptic:
    enabled: true
    min_rows: 30                  # complete rows (claim columns plus the control) needed to check
    min_link_to_control: 0.25     # the control must go with BOTH claim columns at least this much (rank association)
    min_drop_fraction: 0.5        # flag when holding the control fixed weakens the association by this fraction or more
    min_original_rho: 0.10        # skip claims whose own rank correlation is already this small
    min_original_eta2: 0.01       # same for group claims (rank eta-squared)
    max_duplicate_rho: 0.9        # a control this close to a claim column is the same measurement; skipped
    max_duplicate_group_link: 0.97  # the same idea for column-versus-group links (normalised rank eta; a real confounder can reach 0.9)
    max_controls_checked: 40      # other columns examined per finding
    max_caveats_per_finding: 3
    max_levels: 12                # a categorical control may have at most this many levels
    min_level_rows: 5             # and every level at least this many rows
    time_budget_seconds: 20       # wall clock for the whole confound check of one run; the rest is 'not checked'
  explainer:
    engine: template              # template (code-written, offline) | api (DeepSeek wording, checked by code)
    max_summary_chars: 400
    max_output_tokens: 900
    timeout_seconds: 45           # one model call per run, no retry
    temperature: 0.0

planner:
  # The planner (PLAN §6), used when hypotheses.proposer.engine is `planner`. DeepSeek reads a
  # brief of Exact and Measured results computed on the EXPLORATION rows only and returns a
  # structured AnalysisSpec; code validates every column, claim and request. Nothing here is a
  # statistical threshold and nothing here reaches the gateway's decision.
  max_claims: 8                 # claims accepted from one plan (further ones are dropped as over budget)
  max_measured_requests: 4      # Measured requests accepted from one plan
  max_narrative_focus: 5        # item ids that may lead the summary
  max_exact_figures: 12         # Exact figures shown to the model (code-ranked)
  max_measured_figures: 8       # Measured headlines shown to the model
  max_columns: 24               # columns described to the model
  max_levels: 8                 # levels listed per label column
  max_prompt_chars: 24000       # system plus brief; over this the run stops rather than truncating silently
  max_output_tokens: 1800
  max_total_tokens: 30000       # input plus output over the one call and its repair
  max_repair_turns: 1           # one extra turn if the first reply is not valid JSON for the spec
  temperature: 0.0
  cheap_measured:               # the brief's Measured pass: small on purpose, never the user's numbers
    max_rows: 400
    outer_folds: 3
    inner_folds: 2
    time_budget_seconds: 40
