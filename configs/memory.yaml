# configs/memory.yaml
# Owner: M. Karthik Reddy — ChromaDB, retrieval, and API settings.

chroma:
  mode: persistent                  # http explicitly selects the compose service
  host: chromadb
  port: 8000
  collection: verified_lessons
  persist_path: memory/chroma       # relative to PRAMANA_DATA_DIR
  embedding_model: all-MiniLM-L6-v2

retrieval:
  top_k: 5
  min_similarity: 0.35
  verified_only: true               # not a toggle — REJECTed content is never stored

api:
  host: 0.0.0.0
  port: 8080
  max_upload_mb: 100
  max_active_runs: 1                # bounded local background execution
  verification_mode: inprocess     # V1 is local; Compose explicitly selects Celery
