<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PRAMANA execution-grounded insight pipeline</title>
  <desc id="desc">A data-analysis pipeline in which models propose claims and deterministic code verifies them before insights can reach the user or long-term memory.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15213b" flood-opacity=".10"/></filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#243B64"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#16824A"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#CB3D4B"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182642; }
      .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 3px; fill: #5D6C86; }
      .title { font-size: 47px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #5D6C86; }
      .step { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #5D6C86; }
      .box-title { font-size: 24px; font-weight: 700; }
      .box-copy { font-size: 18px; fill: #4D5D78; }
      .small { font-size: 15px; fill: #5D6C86; }
      .tiny { font-size: 13px; fill: #5D6C86; }
      .white { fill: white; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFD"/>
  <rect x="0" y="0" width="1920" height="13" fill="#243B64"/>

  <text x="95" y="82" class="eyebrow">PRAMANA • SYSTEM ARCHITECTURE</text>
  <text x="95" y="140" class="title">Models propose. Code decides.</text>
  <text x="95" y="180" class="subtitle">Every claim is execution-grounded before it reaches the user or long-term memory.</text>

  <!-- trust invariant -->
  <rect x="1350" y="70" width="475" height="105" rx="20" fill="#EEF3FF" stroke="#AFC1E8" stroke-width="2"/>
  <circle cx="1394" cy="122" r="23" fill="#243B64"/>
  <path d="M1383 123 l8 8 l15 -19" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1435" y="114" class="box-title" font-size="20">Trust invariant</text>
  <text x="1435" y="145" class="box-copy" font-size="16">Memory write  ⇒  verdict = PASS</text>

  <!-- workflow rail -->
  <text x="95" y="265" class="eyebrow">THE EXECUTION PATH</text>
  <line x1="290" y1="390" x2="329" y2="390" stroke="#243B64" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <line x1="580" y1="390" x2="619" y2="390" stroke="#243B64" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <line x1="870" y1="390" x2="909" y2="390" stroke="#243B64" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <line x1="1160" y1="390" x2="1199" y2="390" stroke="#243B64" stroke-width="4" marker-end="url(#arrowNavy)"/>

  <!-- 1 -->
  <g filter="url(#shadow)">
    <rect x="95" y="300" width="195" height="180" rx="22" fill="#FFFFFF" stroke="#B9C5D7" stroke-width="2"/>
    <circle cx="130" cy="338" r="20" fill="#DDE7FB"/><text x="124" y="345" font-size="18" font-weight="700" fill="#243B64">1</text>
    <text x="120" y="387" class="box-title">Input</text>
    <text x="120" y="420" class="box-copy">Dataset</text><text x="120" y="447" class="box-copy">+ optional question</text>
  </g>
  <!-- 2 -->
  <g filter="url(#shadow)">
    <rect x="330" y="300" width="250" height="180" rx="22" fill="#EAF5FF" stroke="#78B5E6" stroke-width="2"/>
    <circle cx="365" cy="338" r="20" fill="#BFE1FB"/><text x="359" y="345" font-size="18" font-weight="700" fill="#155A8A">2</text>
    <text x="355" y="387" class="box-title">Prepare</text>
    <text x="355" y="420" class="box-copy">Ingest · clean · profile</text><text x="355" y="447" class="box-copy">Schema + summaries</text>
  </g>
  <!-- 3 -->
  <g filter="url(#shadow)">
    <rect x="620" y="300" width="250" height="180" rx="22" fill="#EAF5FF" stroke="#78B5E6" stroke-width="2"/>
    <circle cx="655" cy="338" r="20" fill="#BFE1FB"/><text x="649" y="345" font-size="18" font-weight="700" fill="#155A8A">3</text>
    <text x="645" y="387" class="box-title">Propose</text>
    <text x="645" y="420" class="box-copy">Structured candidate claims</text><text x="645" y="447" class="box-copy">Batch capped by code</text>
  </g>
  <!-- 4 -->
  <g filter="url(#shadow)">
    <rect x="910" y="280" width="250" height="220" rx="22" fill="#F0EBFF" stroke="#9277D6" stroke-width="3"/>
    <circle cx="945" cy="322" r="20" fill="#D7CBFC"/><text x="939" y="329" font-size="18" font-weight="700" fill="#5C3CAA">4</text>
    <text x="935" y="374" class="box-title">Verify</text>
    <text x="935" y="406" class="box-copy">Screen · generate test code</text><text x="935" y="433" class="box-copy">Sandbox · execute · BH-FDR</text><text x="935" y="460" class="box-copy">Proof object + verdict</text>
  </g>
  <!-- 5 -->
  <g filter="url(#shadow)">
    <rect x="1200" y="300" width="250" height="180" rx="22" fill="#FFFFFF" stroke="#B9C5D7" stroke-width="2"/>
    <circle cx="1235" cy="338" r="20" fill="#DDE7FB"/><text x="1229" y="345" font-size="18" font-weight="700" fill="#243B64">5</text>
    <text x="1225" y="387" class="box-title">Report</text>
    <text x="1225" y="420" class="box-copy">PASS insights + proof</text><text x="1225" y="447" class="box-copy">REJECT reason included</text>
  </g>

  <!-- decision lane -->
  <path d="M1035 508 V575 H800 V627" fill="none" stroke="#16824A" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1035 508 V575 H1100 V627" fill="none" stroke="#CB3D4B" stroke-width="4" marker-end="url(#arrowRed)"/>
  <rect x="948" y="540" width="173" height="37" rx="18" fill="#FFFFFF" stroke="#D7DFEC"/>
  <text x="972" y="564" class="small" font-weight="700">Gate outcome</text>
  <g filter="url(#shadow)">
    <rect x="630" y="627" width="340" height="128" rx="20" fill="#DDF7E6" stroke="#45B96E" stroke-width="2"/>
    <text x="665" y="675" class="box-title" fill="#116334">PASS</text>
    <text x="665" y="707" class="box-copy">Verified insight</text><text x="665" y="733" class="small">Eligible for memory and report</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1000" y="627" width="340" height="128" rx="20" fill="#FFE6E7" stroke="#EA7380" stroke-width="2"/>
    <text x="1035" y="675" class="box-title" fill="#A61D2B">REJECT</text>
    <text x="1035" y="707" class="box-copy">Refuted · negligible · inconclusive</text><text x="1035" y="733" class="small">or not testable — never stored</text>
  </g>
  <path d="M800 762 V810" fill="none" stroke="#16824A" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1100 762 V810" fill="none" stroke="#CB3D4B" stroke-width="4" marker-end="url(#arrowRed)"/>

  <!-- outcome -->
  <g filter="url(#shadow)">
    <rect x="510" y="810" width="920" height="120" rx="22" fill="#FFFFFF" stroke="#243B64" stroke-width="3"/>
    <text x="550" y="858" class="box-title">User-facing result</text>
    <text x="550" y="894" class="box-copy">Only PASS insights are shown as findings — each includes its full, reproducible proof object.</text>
    <line x1="1095" y1="830" x2="1095" y2="908" stroke="#D7DFEC" stroke-width="2"/>
    <text x="1135" y="858" class="box-title" font-size="20">Audit trail</text><text x="1135" y="891" class="small">Rejected claims remain visible with reasons.</text>
  </g>

  <!-- supporting rails -->
  <text x="95" y="560" class="eyebrow">MODEL ROLES — NEVER THE DECISION MAKER</text>
  <g>
    <rect x="95" y="590" width="420" height="95" rx="18" fill="#FFF4E2" stroke="#E9AC4A" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="125" y="628" class="box-title" font-size="19">Gemma (local)</text><text x="125" y="657" class="small">Schema labels · cleaning suggestions · lessons</text>
  </g>
  <g>
    <rect x="95" y="705" width="420" height="95" rx="18" fill="#FFF4E2" stroke="#E9AC4A" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="125" y="743" class="box-title" font-size="19">Analysis LLM</text><text x="125" y="772" class="small">Proposes structured candidates — no statistics</text>
  </g>
  <g>
    <rect x="95" y="820" width="350" height="95" rx="18" fill="#FFF4E2" stroke="#E9AC4A" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="125" y="858" class="box-title" font-size="19">DeepSeek V4</text><text x="125" y="887" class="small">Writes falsification harness only</text>
  </g>
  <path d="M515 637 H590 V390 H610" fill="none" stroke="#E9AC4A" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrowNavy)"/>
  <path d="M515 752 H595 V415 H610" fill="none" stroke="#E9AC4A" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrowNavy)"/>
  <path d="M445 867 H565 V465 H900" fill="none" stroke="#E9AC4A" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrowNavy)"/>

  <!-- memory loop -->
  <rect x="1485" y="300" width="340" height="180" rx="22" fill="#FFF9D8" stroke="#D2B04D" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1515" y="347" class="step">EPISODE MODE • PLANNED</text>
  <text x="1515" y="385" class="box-title">Verified Memory</text>
  <text x="1515" y="418" class="box-copy">ChromaDB + embeddings</text><text x="1515" y="445" class="box-copy">PASS lessons become hints</text>
  <path d="M1485 390 H1460" fill="none" stroke="#D2B04D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowNavy)"/>
  <path d="M800 762 V780 H1485 V480" fill="none" stroke="#D2B04D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowNavy)"/>

  <!-- foundation -->
  <rect x="95" y="970" width="1730" height="58" rx="18" fill="#243B64"/>
  <text x="130" y="1007" class="white" font-size="18" font-weight="700">Built beneath every stage</text>
  <text x="465" y="1007" class="white" font-size="17">LangGraph orchestration</text><circle cx="706" cy="1001" r="4" fill="#9FB3D8"/>
  <text x="730" y="1007" class="white" font-size="17">Celery sandbox</text><circle cx="903" cy="1001" r="4" fill="#9FB3D8"/>
  <text x="927" y="1007" class="white" font-size="17">Langfuse tracing</text><circle cx="1111" cy="1001" r="4" fill="#9FB3D8"/>
  <text x="1135" y="1007" class="white" font-size="17">FastAPI</text><circle cx="1232" cy="1001" r="4" fill="#9FB3D8"/>
  <text x="1256" y="1007" class="white" font-size="17">Docker</text><circle cx="1354" cy="1001" r="4" fill="#9FB3D8"/>
  <text x="1378" y="1007" class="white" font-size="17">Tested statistics library</text>
</svg>
